[package]
name = "sqns"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sqns command line client"

[features]
default = ["dnssec"]
# Validated DNSSEC resolution for sqns:// addresses. Costs ~1.5 MB of binary;
# without it an sqns:// hostname is refused rather than resolved unvalidated.
dnssec = ["sqns-client/dnssec"]

[dependencies]
sqns-core = { workspace = true }
sqns-client = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
